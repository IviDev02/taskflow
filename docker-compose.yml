services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/taskflow
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      CLIENT_ORIGIN: http://localhost:${WEB_PORT:-8080}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mongo-data:
